# Collects live Kolkata jobs into the database.
#   Twice a day : Adzuna "recent" (new jobs only, a few API calls)
#   Weekly      : Adzuna "full"   (all jobs, closes jobs that disappeared, ~75 calls)
# Company job boards (Greenhouse / Lever) are fully checked on every run.
# Times are UTC: 03:23 and 13:23 UTC = 08:53 and 18:53 IST; Sunday 21:47 UTC = Monday 03:17 IST.
name: Data pipeline

on:
  schedule:
    - cron: "23 3,13 * * *"     # daily, recent mode
    - cron: "47 21 * * 0"       # weekly, full mode
  workflow_dispatch:            # "Run workflow" button on GitHub
    inputs:
      adzuna_mode:
        description: "Adzuna mode"
        type: choice
        options: [recent, full]
        default: recent

permissions:
  contents: read

concurrency:                    # never run two pipelines at the same time
  group: data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_MODE: ${{ github.event.schedule == '47 21 * * 0' && 'full' || inputs.adzuna_mode || 'recent' }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: python run_pipeline.py --adzuna-mode "$ADZUNA_MODE" --trigger "$TRIGGER"
